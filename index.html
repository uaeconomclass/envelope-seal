<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Запечатываем ваше письмо</title><style>html,body{margin:0;background:#0b1020}body{min-width:280px}</style></head><body>
<link rel="stylesheet" href="dist/envelope.css">
<section class="envelope" data-trigger="inview" lang="ru" aria-label="Запечатываем ваше письмо">
  <div class="es-frame">
    <div class="es-stage">
      <div class="es-objects" aria-hidden="true">
        <div class="es-abs es-aura" data-part="aura"></div>
        <img class="es-abs es-trails" data-part="trails" src="dist/assets/glow_trails.webp" alt="" width="600" height="400">
        <div class="es-abs" data-part="env">
          <div class="es-abs" data-part="back"></div>
          <div class="es-abs" data-part="flap-wrap"><div data-part="flap"><div class="es-face es-inner"></div><div class="es-face es-outer"></div></div></div>
          <img class="es-abs" data-part="letter" src="dist/assets/letter.webp" alt="" width="350" height="200">
          <div class="es-abs" data-part="pocket"></div>
          <img class="es-abs" data-part="seal" src="dist/assets/seal.webp" alt="" width="112" height="112">
        </div>
        <div class="es-abs" data-part="flash"></div>
        <img class="es-abs" data-part="stamp" src="dist/assets/stamp.webp" alt="" width="180" height="195">
      </div>
      <div class="es-copy"><h2>Запечатываем<br>ваше письмо…</h2><p>Планы внутри. Впереди — целый год возможностей.</p></div>
    </div>
  </div>
  <p class="es-sr">Мои планы: Больше путешествий; Финансовая подушка; Инвестиции; Меньше спонтанных покупок.</p>
  <div class="es-controls"><button type="button" data-part="replay">Повторить</button><button type="button" data-part="pause">Пауза</button></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="dist/envelope.js" defer></script>
<script>
document.addEventListener('envelope:ready',e=>{window.tl=e.target.envelope.timeline;window.fit=e.target.envelope.fit;});
</script></body></html>
